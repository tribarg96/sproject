<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School LMS</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --text: #1a1a1a;
      --text-sec: #6c757d;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --border: #e5e7eb;
      --success: #10b981;
      --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #f3f4f6;
      --text-sec: #9ca3af;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --border: #2d2d2d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; transition: 0.3s; }
    
    /* Auth Screen */
    #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .auth-box { background: var(--surface); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); width: 350px; text-align: center; }
    .auth-box h2 { color: var(--primary); margin-bottom: 1.5rem; }
    .auth-box input, .auth-box select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    
    /* Layout */
    #app { display: none; width: 100%; }
    .sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; }
    .sidebar h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 8px; }
    .nav-btn { background: none; border: none; color: var(--text-sec); text-align: left; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-bottom: 4px; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }
    .user-info { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
    
    .main { flex: 1; padding: 2rem; overflow-y: auto; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards & UI */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    .card h3 { color: var(--primary); margin-bottom: 0.5rem; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: var(--primary); color: white; }
    .badge.pending { background: #f59e0b; }
    .badge.done { background: var(--success); }
    
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }

    /* Chat */
    .chat-container { display: flex; flex-direction: column; height: calc(100vh - 100px); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; background: var(--surface); border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--border); }
    .msg { margin-bottom: 12px; padding: 10px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--primary); }
    .msg .author { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
    .msg .time { font-size: 0.75rem; color: var(--text-sec); float: right; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-sec); font-weight: 600; }

    /* Theme Toggle */
    .theme-toggle { position: fixed; top: 1rem; right: 1rem; background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; border-radius: 20px; cursor: pointer; color: var(--text); }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2>🎓 School LMS</h2>
      <input type="text" id="auth-username" placeholder="Логин">
      <input type="password" id="auth-password" placeholder="Пароль">
      <input type="text" id="auth-display" placeholder="Имя и Фамилия (для регистрации)">
      <select id="auth-role">
        <option value="student">Ученик</option>
        <option value="teacher">Учитель</option>
      </select>
      <button class="btn" style="width:100%; margin-top:10px;" onclick="handleAuth()">Войти / Регистрация</button>
      <p id="auth-error" style="color: var(--danger); margin-top: 10px; font-size: 0.9rem;"></p>
    </div>
  </div>

  <!-- Основное приложение -->
  <div id="app">
    <button class="theme-toggle" onclick="toggleTheme()">🌓 Тема</button>
    
    <div class="sidebar">
      <h1>🎓 ClassHub</h1>
      <button class="nav-btn active" onclick="showSection('dashboard')">📊 Дневник</button>
      <button class="nav-btn" onclick="showSection('assignments')">📚 Задания</button>
      <button class="nav-btn" onclick="showSection('homework')">📝 Домашняя работа</button>
      <button class="nav-btn" onclick="showSection('chat')">💬 Чат класса</button>
      
      <div class="user-info">
        <div id="user-name" style="font-weight: bold;"></div>
        <div id="user-role" style="color: var(--text-sec); font-size: 0.9rem;"></div>
        <button class="btn btn-outline btn-sm" style="width:100%; margin-top:8px;" onclick="logout()">Выйти</button>
      </div>
    </div>

    <div class="main">
      <!-- Дневник -->
      <div id="dashboard" class="section active">
        <h2>Электронный дневник</h2>
        <div class="card" style="margin-top: 1rem;">
          <table id="grades-table">
            <thead><tr><th>Предмет</th><th>Оценка</th><th>Комментарий</th><th>Дата</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <!-- Форма для учителя -->
        <div id="teacher-grade-form" class="card" style="display:none;">
          <h3>Поставить оценку</h3>
          <input type="text" id="grade-student" placeholder="Логин ученика" style="padding:8px; width:100%; margin:8px 0;">
          <input type="text" id="grade-subject" placeholder="Предмет" style="padding:8px; width:100%; margin:8px 0;">
          <input type="text" id="grade-value" placeholder="Оценка (5, 4, 3, 2)" style="padding:8px; width:100%; margin:8px 0;">
          <input type="text" id="grade-comment" placeholder="Комментарий" style="padding:8px; width:100%; margin:8px 0;">
          <button class="btn" onclick="addGrade()">Поставить оценку</button>
        </div>
      </div>

      <!-- Задания -->
      <div id="assignments" class="section">
        <h2>Задания</h2>
        <div id="teacher-assign-form" class="card" style="display:none;">
          <h3>Новое задание</h3>
          <input type="text" id="assign-title" placeholder="Название" style="padding:8px; width:100%; margin:8px 0;">
          <input type="text" id="assign-subject" placeholder="Предмет" style="padding:8px; width:100%; margin:8px 0;">
          <textarea id="assign-desc" placeholder="Описание" style="padding:8px; width:100%; margin:8px 0; height:80px;"></textarea>
          <button class="btn" onclick="createAssignment()">Опубликовать</button>
        </div>
        <div id="assignments-list"></div>
      </div>

      <!-- Домашняя работа -->
      <div id="homework" class="section">
        <h2>Отправка домашней работы</h2>
        <div class="card">
          <select id="hw-assignment-select" style="padding:8px; width:100%; margin-bottom:10px;"></select>
          <textarea id="hw-content" placeholder="Введите решение или ссылку на файл..." style="padding:8px; width:100%; height:100px; margin-bottom:10px;"></textarea>
          <button class="btn" onclick="submitHomework()">Отправить на проверку</button>
        </div>
        <div id="teacher-hw-list" class="card" style="display:none;">
          <h3>Сданные работы (Панель учителя)</h3>
          <div id="hw-submissions"></div>
        </div>
      </div>

      <!-- Чат -->
      <div id="chat" class="section">
        <h2>Чат класса</h2>
        <div class="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input">
            <input type="text" id="chat-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;

    // Тема
    function toggleTheme() {
      const html = document.documentElement;
      const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    // Авторизация
    async function handleAuth() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const displayName = document.getElementById('auth-display').value.trim();
      const role = document.getElementById('auth-role').value;

      if (!username || !password) return alert('Заполните поля');

      // Пробуем войти
      let res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.status === 401) {
        // Если не получилось, регистрируем
        res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role, displayName })
        });
      }

      const data = await res.json();
      if (data.error) {
        document.getElementById('auth-error').textContent = data.error;
      } else {
        currentUser = data;
        localStorage.setItem('user', JSON.stringify(currentUser));
        initApp();
      }
    }

    function initApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('user-name').textContent = currentUser.display_name || currentUser.username;
      document.getElementById('user-role').textContent = currentUser.role === 'teacher' ? '👨‍🏫 Учитель' : '👨‍🎓 Ученик';

      if (currentUser.role === 'teacher') {
        document.getElementById('teacher-grade-form').style.display = 'block';
        document.getElementById('teacher-assign-form').style.display = 'block';
        document.getElementById('teacher-hw-list').style.display = 'block';
      }

      socket.emit('join', currentUser.username);
      loadGrades();
      loadAssignments();
      loadMessages();
      
      socket.on('receive_message', (msg) => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="time">${new Date(msg.created_at).toLocaleTimeString()}</span><div class="author">${msg.sender_display_name}</div><div>${msg.content}</div>`;
        document.getElementById('chat-messages').appendChild(div);
        document.getElementById('chat-messages').scrollTop = 99999;
      });
    }

    // Проверка сохраненной сессии
    const saved = localStorage.getItem('user');
    if (saved) {
      currentUser = JSON.parse(saved);
      initApp();
    }

    function logout() {
      localStorage.removeItem('user');
      location.reload();
    }

    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
      if (id === 'homework' && currentUser.role === 'teacher') loadTeacherHomework();
    }

    // === ДНЕВНИК ===
    async function loadGrades() {
      const res = await fetch(`/api/grades/${currentUser.username}`);
      const grades = await res.json();
      const tbody = document.querySelector('#grades-table tbody');
      tbody.innerHTML = grades.map(g => `
        <tr>
          <td><b>${g.subject}</b></td>
          <td><span class="badge">${g.grade}</span></td>
          <td>${g.comment || '-'}</td>
          <td style="color:var(--text-sec)">${new Date(g.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('') || '<tr><td colspan="4" style="text-align:center">Пока нет оценок</td></tr>';
    }

    async function addGrade() {
      const student = document.getElementById('grade-student').value;
      const subject = document.getElementById('grade-subject').value;
      const grade = document.getElementById('grade-value').value;
      const comment = document.getElementById('grade-comment').value;
      await fetch('/api/grades', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_username: student, subject, grade, comment })
      });
      alert('Оценка поставлена!');
      loadGrades(); // Если учитель смотрит свой дневник, обновит. В реальном приложении нужен список всех оценок.
    }

    // === ЗАДАНИЯ ===
    async function loadAssignments() {
      const res = await fetch('/api/assignments');
      const assigns = await res.json();
      const list = document.getElementById('assignments-list');
      const select = document.getElementById('hw-assignment-select');
      
      list.innerHTML = assigns.map(a => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:start;">
            <div>
              <span class="badge">${a.subject}</span>
              <h3 style="margin-top:8px;">${a.title}</h3>
              <p style="color:var(--text-sec); margin-top:4px;">${a.description}</p>
              <small style="color:var(--text-sec)">Сдать до: ${new Date(a.due_date).toLocaleDateString()}</small>
            </div>
          </div>
        </div>
      `).join('') || '<p>Нет активных заданий</p>';

      select.innerHTML = '<option value="">Выберите задание...</option>' + 
        assigns.map(a => `<option value="${a.id}">${a.subject}: ${a.title}</option>`).join('');
    }

    async function createAssignment() {
      const title = document.getElementById('assign-title').value;
      const subject = document.getElementById('assign-subject').value;
      const desc = document.getElementById('assign-desc').value;
      await fetch('/api/assignments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description: desc, subject, due_date: new Date().toISOString(), created_by: currentUser.username })
      });
      alert('Задание создано!');
      loadAssignments();
    }

    // === ДОМАШНЯЯ РАБОТА ===
    async function submitHomework() {
      const assignment_id = document.getElementById('hw-assignment-select').value;
      const content = document.getElementById('hw-content').value;
      if (!assignment_id || !content) return alert('Заполните все поля');

      await fetch('/api/homework', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ assignment_id, student_username: currentUser.username, student_display_name: currentUser.display_name, content })
      });
      alert('Работа отправлена на проверку!');
      document.getElementById('hw-content').value = '';
    }

    async function loadTeacherHomework() {
      // Для простоты загружаем все сдачи (в реальном проекте фильтровать по заданиям учителя)
      const res = await fetch('/api/assignments');
      const assigns = await res.json();
      const container = document.getElementById('hw-submissions');
      container.innerHTML = 'Загрузка...';
      
      let html = '';
      for (const a of assigns) {
        const resHw = await fetch(`/api/homework/${a.id}`);
        const hws = await resHw.json();
        if (hws.length > 0) {
          html += `<h4 style="margin:1rem 0 0.5rem; color:var(--primary)">${a.subject}: ${a.title}</h4>`;
          html += hws.map(h => `
            <div class="card" style="padding:1rem;">
              <div style="display:flex; justify-content:space-between;">
                <b>${h.student_display_name}</b>
                <span class="badge ${h.status === 'Проверено' ? 'done' : 'pending'}">${h.status}</span>
              </div>
              <p style="margin:8px 0; background:var(--bg); padding:8px; border-radius:4px;">${h.content}</p>
              ${h.status !== 'Проверено' ? `<button class="btn btn-sm" onclick="approveHw('${h.id}')">✅ Проверено</button>` : ''}
            </div>
          `).join('');
        }
      }
      container.innerHTML = html || '<p>Нет сданных работ</p>';
    }

    async function approveHw(id) {
      await fetch(`/api/homework/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'Проверено' })
      });
      loadTeacherHomework();
    }

    // === ЧАТ ===
    async function loadMessages() {
      const res = await fetch('/api/messages');
      const msgs = await res.json();
      const container = document.getElementById('chat-messages');
      container.innerHTML = msgs.map(m => `
        <div class="msg">
          <span class="time">${new Date(m.created_at).toLocaleTimeString()}</span>
          <div class="author">${m.sender_display_name}</div>
          <div>${m.content}</div>
        </div>
      `).join('');
      container.scrollTop = 99999;
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content) return;
      socket.emit('send_message', {
        sender_username: currentUser.username,
        sender_display_name: currentUser.display_name,
        content
      });
      input.value = '';
    }
  </script>
</body>
</html>
